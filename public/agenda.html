<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flooty Pet - Agenda</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/agenda.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
</head>
<body>
    <aside class="sidebar">
        <img src="assets/branding/logo_white.png" alt="Logo da flooty pet">
        <nav>
            <ul>
                <li><a href="#" class="link"><img src="assets/agenda/icon_agenda.png" alt="">Agenda</a></li>
                <li><a href="#" class="link"><img src="assets/agenda/icon_clientes.png" alt="">Clientes</a></li>
                <li><a href="#" class="link"><img src="assets/agenda/icon_hospedagem.png" alt="">Hospedagem</a></li>
                <li><a href="#" class="link"><img src="assets/agenda/icon_pacotes.png" alt="">Pacotes</a></li>
                <li><a href="#" class="link"><img src="assets/agenda/icon_relatorio.png" alt="">Relatórios</a></li>
                <li><a href="#" class="link"><img src="assets/agenda/icon_finance.png" alt="">Financeiro</a></li>
                <li><a href="#" class="link"><img src="assets/agenda/icon_estoque.png" alt="">Estoque</a></li>
                <li><a href="#" class="link"><img src="assets/agenda/icon_settings.png" alt="">Configuração</a></li>
            </ul>
        </nav>
        <a href="#" class="link"><img src="assets/agenda/icon_logout.png" alt="">Sair</a>
        <p class="creditos">&copy; Direitos reservados. 2026</p>
    </aside>
    <main> 
        <header>
            <h1>Agenda</h1>
            <div class="mensagens-container">
                <img src="assets/agenda/icon_mensagem.png" alt="Icone de sino">
            </div>
            <div class="conta-container">
                <div>
                    <p class="conta-nome">Administrador</p>
                    <p class="conta-email">admin@pet.com</p>
                </div>
                <img src="https://s2.glbimg.com/yrFgwzwrwxxpO7pJoejZxwxpRx0=/620x620/smart/e.glbimg.com/og/ed/f/original/2022/03/11/mister_mainer.jpeg" alt="">
            </div>
        </header>
        <div class="container-agenda">
            <div class="header-agenda">
                <div class="calendar-control">
                    <button class="control"><</button>
                    <button class="control dataatual">QUINTA-FEIRA 22/05</button>
                    <button class="control">></button>
                    <button class="control">Hoje</button>
                </div>
                <button type="button" class="button"><span class="material-symbols-rounded">add_ad</span> Novo Agendamento</button>
            </div>
            <div class="agenda">
                <div class="card">
                    <span class="agendamento-horario">10:45</span>
                    <div class="pet-info">
                        <div class="card-image">
                            <img src="assets/agenda/pets/shihtzu1.jpeg" alt="">
                        </div>
                        <div>
                            <h3>Amora</h3>
                            <p>Shih Tzu</p>
                            <p>Cleiton Silva</p>
                        </div>
                    </div>
                    <div class="agendamento-info">
                        <span class="material-symbols-rounded icon">paid</span>
                        <span class="material-symbols-rounded icon active">content_cut</span>
                        <span class="material-symbols-rounded icon">event_available</span>
                        <span class="material-symbols-rounded icon">directions_car</span>
                    </div>
                    <p class="agendamento-status">Em serviço</p>
                </div>
            </div>
        </div>
    </main>
    <script src="js/agenda.js"></script>
</body>
</html>
