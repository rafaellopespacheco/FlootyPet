<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flooty Pet - Cliente</title>
    <link rel="shortcut icon" href="/assets/branding/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,1,-50..200"/>
    <link rel="stylesheet" href="/css/info-cliente.css">

</head>

<body>

    <aside class="sidebar">
        <img src="/assets/branding/logo_white.png" alt="Logo da flooty pet">
        <nav>
            <ul>
                <li><a href="/agenda" class="link"><span class="material-symbols-rounded">calendar_today</span>Agenda</a></li>
                <li><a href="/clientes" class="link"><span class="material-symbols-rounded">group</span>Clientes</a></li>
                <li><a href="#" class="link desativado"><span class="material-symbols-rounded">home</span>Hospedagem</a></li>
                <li><a href="#" class="link desativado"><span class="material-symbols-rounded">deployed_code</span>Pacotes</a></li>
                <li><a href="#" class="link desativado"><span class="material-symbols-rounded">document_search</span>Relatórios</a></li>
                <li><a href="#" class="link desativado"><span class="material-symbols-rounded">account_balance</span>Financeiro</a></li>
                <li><a href="#" class="link desativado"><span class="material-symbols-rounded">package_2</span>Estoque</a></li>
                <li><a href="#" class="link desativado"><span class="material-symbols-rounded">settings</span>Configuração</a></li>
                <li><a href="/atualizacoes" class="link"><span class="material-symbols-rounded">update</span>Atualizações</a></li>
            </ul>
        </nav>
        <button type="button" class="link" id="logout"><span class="material-symbols-rounded">logout</span>Sair</button>
        <p class="creditos">&copy; Direitos reservados. 2026</p>
    </aside>

    <main>
        <header>
            <h1 id="cliente-header">Cliente</h1>
            <div class="mensagens-container">
                <img src="/assets/agenda/icon_mensagem.png">
            </div>
            <div class="conta-container">
                <div>
                    <p class="conta-nome"></p>
                    <p class="conta-email"></p>
                </div>
                <img src="https://s2.glbimg.com/yrFgwzwrwxxpO7pJoejZxwxpRx0=/620x620/smart/e.glbimg.com/og/ed/f/original/2022/03/11/mister_mainer.jpeg">
            </div>
        </header>
        <div class="cliente-container">
            <div class="tabs">
                <button class="tab-button active" data-tab="informacoes">
                    Informações
                </button>
                <button class="tab-button" data-tab="pets">
                    Pets
                </button>
            </div>

            <!-- INFORMAÇÕES -->
            <div class="tab-content active" id="informacoes">
                <div class="cliente-card">
                    <div class="cliente-top">
                        <div>
                            <h2 id="cliente-nome-top">
                                Carregando...
                            </h2>
                            <p class="cliente-id" id="cliente-id">
                                Cliente #--
                            </p>
                        </div>
                        <div class="cliente-actions">
                            <button class="button-save" id="salvar-cliente">
                                <span class="material-symbols-rounded">save</span>
                                Salvar alterações
                            </button>
                            <button class="button-remove" id="remover-cliente">
                                <span class="material-symbols-rounded">delete</span>
                                Remover
                            </button>
                        </div>
                    </div>
                    <div class="cliente-grid">
                        <div class="form-group">
                            <label>Nome</label>
                            <input type="text" id="nome">
                        </div>
                        <div class="form-group">
                            <label>Telefone</label>
                            <input type="text" id="telefone">
                        </div>
                        <div class="form-group">
                            <label>CPF</label>
                            <input type="text" id="cpf">
                        </div>
                        <div class="form-group">
                            <label>Data de nascimento</label>
                            <input type="date" id="datanasc">
                        </div>
                        <div class="form-group">
                            <label>CEP</label>
                            <input type="text" id="cep">
                        </div>
                        <div class="form-group">
                            <label>UF</label>
                            <input type="text" id="uf">
                        </div>
                        <div class="form-group full-width">
                            <label>Endereço</label>
                            <input type="text" id="logradouro">
                        </div>
                        <div class="form-group">
                            <label>Bairro</label>
                            <input type="text" id="bairro">
                        </div>
                        <div class="form-group">
                            <label>Cidade</label>
                            <input type="text" id="cidade">
                        </div>
                        <div class="form-group full-width">
                            <label>Observação</label>
                            <textarea id="obs"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PETS -->
            <div class="tab-content" id="pets">
                <div class="pets-grid">
                    <button type="button" id="add-pet">
                        <div class="pet-card add-pet-card">
                            <span class="material-symbols-rounded">add_circle</span>
                        </div>
                    </button>
                    
                </div>
            </div>
        </div>
    </main>
<script src="/js/global.js"></script>
<script type="module" src="/js/info-cliente.js"></script>
</body>
</html>
