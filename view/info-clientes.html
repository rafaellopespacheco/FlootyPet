<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flooty Pet - Cliente</title>

    <link rel="shortcut icon" href="/assets/branding/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="/css/global.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,1,-50..200"/>

    <style>

        .cliente-container {
            padding: 25px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab-button {
            border: none;
            background-color: #ececec;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            transition: .2s;
        }

        .tab-button.active {
            background-color: #151a2d;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .cliente-card {
            background-color: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .cliente-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .cliente-top h2 {
            font-size: 1.8em;
        }

        .cliente-id {
            color: #777;
            margin-top: 5px;
        }

        .cliente-actions {
            display: flex;
            gap: 10px;
        }

        .button-save {
            border: none;
            background-color: #151a2d;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: .2s;
        }

        .button-save:hover {
            transform: translateY(-2px);
        }

        .cliente-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: .95em;
            color: #666;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            border: 1px solid #dcdcdc;
            border-radius: 10px;
            padding: 13px;
            font-size: 1em;
            outline: none;
            transition: .2s;
            background-color: #fafafa;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #151a2d;
            background-color: white;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .pets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .pet-card {
            background-color: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .pet-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .pet-header img {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
        }

        .pet-badge {
            background-color: #ececec;
            display: inline-block;
            padding: 7px 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: .9em;
        }

    </style>

</head>

<body>

    <aside class="sidebar">

        <img src="/assets/branding/logo_white.png">

        <nav>
            <ul>

                <li><a href="/agenda.html" class="link"><img src="/assets/agenda/icon_agenda.png">Agenda</a></li>

                <li><a href="/clientes.html" class="link"><img src="/assets/agenda/icon_clientes.png">Clientes</a></li>

                <li><a href="#" class="link"><img src="/assets/agenda/icon_hospedagem.png">Hospedagem</a></li>

                <li><a href="#" class="link"><img src="/assets/agenda/icon_pacotes.png">Pacotes</a></li>

                <li><a href="#" class="link"><img src="/assets/agenda/icon_relatorio.png">Relatórios</a></li>

                <li><a href="#" class="link"><img src="/assets/agenda/icon_finance.png">Financeiro</a></li>

                <li><a href="#" class="link"><img src="/assets/agenda/icon_estoque.png">Estoque</a></li>

                <li><a href="#" class="link"><img src="/assets/agenda/icon_settings.png">Configuração</a></li>

            </ul>
        </nav>

        <a href="#" class="link">
            <img src="/assets/agenda/icon_logout.png">
            Sair
        </a>

        <p class="creditos">
            &copy; Direitos reservados. 2026
        </p>

    </aside>

    <main>

        <header>

            <h1 id="cliente-header">
                Cliente
            </h1>

            <div class="mensagens-container">
                <img src="/assets/agenda/icon_mensagem.png">
            </div>

            <div class="conta-container">

                <div>
                    <p class="conta-nome">Administrador</p>
                    <p class="conta-email">admin@pet.com</p>
                </div>

                <img src="https://s2.glbimg.com/yrFgwzwrwxxpO7pJoejZxwxpRx0=/620x620/smart/e.glbimg.com/og/ed/f/original/2022/03/11/mister_mainer.jpeg">

            </div>

        </header>

        <div class="cliente-container">

            <div class="tabs">

                <button class="tab-button active" data-tab="informacoes">
                    Informações
                </button>

                <button class="tab-button" data-tab="pets">
                    Pets
                </button>

            </div>

            <!-- INFORMAÇÕES -->
            <div class="tab-content active" id="informacoes">

                <div class="cliente-card">

                    <div class="cliente-top">

                        <div>
                            <h2 id="cliente-nome-top">
                                Carregando...
                            </h2>

                            <p class="cliente-id" id="cliente-id">
                                Cliente #--
                            </p>
                        </div>

                        <div class="cliente-actions">

                            <button class="button-save" id="salvar-cliente">

                                <span class="material-symbols-rounded">
                                    save
                                </span>

                                Salvar alterações

                            </button>

                        </div>

                    </div>

                    <div class="cliente-grid">

                        <div class="form-group">

                            <label>Nome</label>

                            <input type="text" id="nome">

                        </div>

                        <div class="form-group">

                            <label>Telefone</label>

                            <input type="text" id="telefone">

                        </div>

                        <div class="form-group">

                            <label>CPF</label>

                            <input type="text" id="cpf">

                        </div>

                        <div class="form-group">

                            <label>Data de nascimento</label>

                            <input type="date" id="datanasc">

                        </div>

                        <div class="form-group">

                            <label>CEP</label>

                            <input type="text" id="cep">

                        </div>

                        <div class="form-group">

                            <label>UF</label>

                            <input type="text" id="uf">

                        </div>

                        <div class="form-group full-width">

                            <label>Endereço</label>

                            <input type="text" id="logradouro">

                        </div>

                        <div class="form-group">

                            <label>Bairro</label>

                            <input type="text" id="bairro">

                        </div>

                        <div class="form-group">

                            <label>Cidade</label>

                            <input type="text" id="cidade">

                        </div>

                        <div class="form-group full-width">

                            <label>Observação</label>

                            <textarea id="obs"></textarea>

                        </div>

                    </div>

                </div>

            </div>

            <!-- PETS -->
            <div class="tab-content" id="pets">

                <div class="pets-grid">

                    <div class="pet-card">

                        <div class="pet-header">

                            <img src="https://placedog.net/300?id=1">

                            <div>

                                <h3>Thor</h3>

                                <p>Golden Retriever</p>

                            </div>

                        </div>

                        <div class="pet-badge">
                            Macho • 4 anos
                        </div>

                    </div>

                    <div class="pet-card">

                        <div class="pet-header">

                            <img src="https://placedog.net/300?id=2">

                            <div>

                                <h3>Luna</h3>

                                <p>Shih-tzu</p>

                            </div>

                        </div>

                        <div class="pet-badge">
                            Fêmea • 2 anos
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

<script type="module">

import { sendAlertModal } from '/js/modal-alert.js';

// =========================
// TABS
// =========================

const tabButtons = document.querySelectorAll('.tab-button');
const tabContents = document.querySelectorAll('.tab-content');

tabButtons.forEach(button => {

    button.addEventListener('click', function () {

        tabButtons.forEach(btn => {
            btn.classList.remove('active');
        });

        tabContents.forEach(content => {
            content.classList.remove('active');
        });

        button.classList.add('active');

        document
            .getElementById(button.dataset.tab)
            .classList
            .add('active');

    });

});

// =========================
// INPUTS
// =========================

const inputNome = document.getElementById('nome');
const inputTelefone = document.getElementById('telefone');
const inputCpf = document.getElementById('cpf');
const inputCep = document.getElementById('cep');
const inputEndereco = document.getElementById('logradouro');
const inputBairro = document.getElementById('bairro');
const inputCidade = document.getElementById('cidade');
const inputUf = document.getElementById('uf');
const inputDataNasc = document.getElementById('datanasc');
const inputObs = document.getElementById('obs');

// =========================
// FORMATADORES
// =========================

function formatarCPF(valor = '') {

    valor = valor.replace(/\D/g, '');
    valor = valor.slice(0, 11);

    if (valor.length > 9) {

        return valor.replace(
            /^(\d{3})(\d{3})(\d{3})(\d{1,2})$/,
            '$1.$2.$3-$4'
        );

    }

    else if (valor.length > 6) {

        return valor.replace(
            /^(\d{3})(\d{3})(\d{1,3})$/,
            '$1.$2.$3'
        );

    }

    else if (valor.length > 3) {

        return valor.replace(
            /^(\d{3})(\d{1,3})$/,
            '$1.$2'
        );

    }

    return valor;

}

function formatarTelefone(valor = '') {

    let numeros = valor.replace(/\D/g, '');

    if (numeros.startsWith('55')) {
        numeros = numeros.slice(2);
    }

    numeros = numeros.slice(0, 11);

    let formatado = '+55 ';

    if (numeros.length > 0) {

        formatado += `(${numeros.slice(0, 2)}`;

        if (numeros.length >= 2) {
            formatado += ') ';
        }

    }

    if (numeros.length > 2) {
        formatado += numeros.slice(2, 7);
    }

    if (numeros.length > 7) {
        formatado += '-' + numeros.slice(7, 11);
    }

    return formatado;

}

function formatarCEP(valor = '') {

    valor = valor.replace(/\D/g, '');
    valor = valor.slice(0, 8);

    if (valor.length > 5) {

        return valor.replace(
            /^(\d{5})(\d{1,3})$/,
            '$1-$2'
        );

    }

    return valor;

}

// =========================
// VALIDAR CPF
// =========================

function validarCPF(cpf) {

    cpf = cpf.replace(/\D/g, '');

    if (
        cpf.length !== 11 ||
        /^(\d)\1{10}$/.test(cpf)
    ) return false;

    let soma = 0;
    let resto;

    for (let i = 1; i <= 9; i++) {

        soma +=
            parseInt(cpf.substring(i - 1, i))
            * (11 - i);

    }

    resto = (soma * 10) % 11;

    if (resto === 10 || resto === 11)
        resto = 0;

    if (
        resto !==
        parseInt(cpf.substring(9, 10))
    ) return false;

    soma = 0;

    for (let i = 1; i <= 10; i++) {

        soma +=
            parseInt(cpf.substring(i - 1, i))
            * (12 - i);

    }

    resto = (soma * 10) % 11;

    if (resto === 10 || resto === 11)
        resto = 0;

    if (
        resto !==
        parseInt(cpf.substring(10, 11))
    ) return false;

    return true;

}

// =========================
// MÁSCARAS
// =========================

inputTelefone.value = '+55 ';

inputCpf.addEventListener('input', function () {

    inputCpf.value =
        formatarCPF(inputCpf.value);

});

inputTelefone.addEventListener('input', function () {

    inputTelefone.value =
        formatarTelefone(inputTelefone.value);

});

inputCep.addEventListener('input', async function () {

    inputCep.value =
        formatarCEP(inputCep.value);

    const cep =
        inputCep.value.replace(/\D/g, '');

    if (cep.length !== 8) return;

    try {

        const resposta =
            await fetch(
                `https://viacep.com.br/ws/${cep}/json/`
            );

        const dados =
            await resposta.json();

        if (dados.erro) {

            sendAlertModal(
                'warning',
                'CEP não encontrado.'
            );

            return;

        }

        inputEndereco.value =
            dados.logradouro || '';

        inputBairro.value =
            dados.bairro || '';

        inputCidade.value =
            dados.localidade || '';

        inputUf.value =
            dados.uf || '';

    }

    catch {

        sendAlertModal(
            'error',
            'Erro ao buscar CEP.'
        );

    }

});

// =========================
// PEGAR ID
// =========================

const clienteId =
    window.location.pathname
        .split('/')
        .pop();

// =========================
// FETCH CLIENTE
// =========================

async function carregarCliente() {

    try {

        const resposta =
            await fetch(`/api/clientes/${clienteId}`);

        if (!resposta.ok) {
            throw new Error();
        }

        const cliente =
            await resposta.json();

        document.getElementById(
            'cliente-header'
        ).textContent =
            cliente.nome || 'Cliente';

        document.getElementById(
            'cliente-nome-top'
        ).textContent =
            cliente.nome || 'Cliente';

        document.getElementById(
            'cliente-id'
        ).textContent =
            `Cliente #${cliente.id}`;

        inputNome.value =
            cliente.nome || '';

        inputTelefone.value =
            formatarTelefone(
                cliente.numero || ''
            );

        inputCpf.value =
            formatarCPF(
                cliente.cpf || ''
            );

        inputDataNasc.value =
            cliente.datanasc || '';

        inputCep.value =
            formatarCEP(
                cliente.cep || ''
            );

        inputUf.value =
            cliente.uf || '';

        inputEndereco.value =
            cliente.logradouro || '';

        inputBairro.value =
            cliente.bairro || '';

        inputCidade.value =
            cliente.cidade || '';

        inputObs.value =
            cliente.obs || '';

    }

    catch (err) {

        console.error(err);

        sendAlertModal(
            'error',
            'Erro ao carregar cliente.'
        );

    }

}

carregarCliente();

// =========================
// SALVAR
// =========================

const buttonSalvar =
    document.getElementById(
        'salvar-cliente'
    );

buttonSalvar.addEventListener(
    'click',
    async function () {

        const dados = {

            nome:
                inputNome.value.trim(),

            telefone:
                inputTelefone.value
                    .replace(/\D/g, ''),

            cpf:
                inputCpf.value
                    .replace(/\D/g, ''),

            datanasc:
                inputDataNasc.value,

            cep:
                inputCep.value
                    .replace(/\D/g, ''),

            uf:
                inputUf.value.trim(),

            logradouro:
                inputEndereco.value.trim(),

            bairro:
                inputBairro.value.trim(),

            cidade:
                inputCidade.value.trim(),

            obs:
                inputObs.value.trim()

        };

        if (!dados.nome) {

            sendAlertModal(
                'warning',
                'Nome obrigatório.'
            );

            return;

        }

        if (
            dados.telefone.length < 12
        ) {

            sendAlertModal(
                'warning',
                'Telefone inválido.'
            );

            return;

        }

        if (
            dados.cpf &&
            !validarCPF(dados.cpf)
        ) {

            sendAlertModal(
                'warning',
                'CPF inválido.'
            );

            return;

        }

        try {

            const resposta =
                await fetch(
                    `/api/clientes/${clienteId}`,
                    {
                        method: 'PUT',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify(dados)
                    }
                );

            const resultado =
                await resposta.json();

            sendAlertModal(
                'sucess',
                resultado.mensagem ||
                'Cliente atualizado.'
            );

        }

        catch {

            sendAlertModal(
                'error',
                'Erro ao salvar alterações.'
            );

        }

    }
);

</script>
</body>
</html>
