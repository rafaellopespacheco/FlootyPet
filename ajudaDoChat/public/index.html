<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de usuários</title>
    <style>
        #usuarios {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        #usuarios div {
            width: 200px;
            background-color: rgb(230, 230, 230);
            padding: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Usuários</h1>
    <form method="get" id="newUser">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome">
        <label for="datanasc">Data de nascimento</label>
        <input type="date" id="datanasc" name="datanasc">
        <button type="submit" id="buttonNewUser">Criar usuários</button>
    </form>
    <div id="usuarios"></div>
    <script>
        const formNewUser = document.getElementById('newUser');

        formNewUser.addEventListener('submit', function(evento){
            evento.preventDefault();
            const nome = document.getElementById('nome').value;
            const datanasc = document.getElementById('datanasc').value;

            fetch('/usuarios', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    nome: nome,
                    datanasc: datanasc
                })
            })
            .then(function(resposta) {
                return resposta.json()
            }) 
            .then(function(dados) {
                alert(dados.mensagem)

                const containerUsuarios = document.getElementById('usuarios');
                const divUsuario = document.createElement('div');
                divUsuario.innerHTML = `<p>ID: ${dados.usuario.id}</p>
                <p>Nome: ${dados.usuario.nome}</p>
                <p>Data de nascimento: ${dados.usuario.datanasc}</p>
                `;
                containerUsuarios.appendChild(divUsuario);
            }) 
        })
        


        fetch('/usuarios')
        .then(function(resposta) {
            return resposta.json();
        })
        .then(function(usuarios) {
            console.log(usuarios)
            const containerUsuarios = document.getElementById('usuarios');
            usuarios.forEach(function(usuario) {
                const divUsuario = document.createElement('div');
                divUsuario.innerHTML = `<p>ID: ${usuario.id}</p>
                <p>Nome: ${usuario.nome}</p>
                <p>Data de nascimento: ${usuario.datanasc}</p>
                `;
                containerUsuarios.appendChild(divUsuario);
            });
        })
    </script>
</body>
</html>
